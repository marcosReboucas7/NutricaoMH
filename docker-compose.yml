services:
  db:
    image: postgres:17-alpine
    container_name: nutricaomh-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nutricaomh}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - nutricaomh-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nutricaomh}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    container_name: nutricaomh-api
    build:
      context: .
      dockerfile: NutricaoMH/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-nutricaomh};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Jwt__Key: ${JWT_KEY:-troque-esta-chave-por-uma-com-pelo-menos-32-caracteres}
      Jwt__Issuer: NutricaoMH
      Jwt__Audience: NutricaoMH
      Jwt__ExpiresInMinutes: "60"
    ports:
      - "8080:8080"

volumes:
  nutricaomh-data:
